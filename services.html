<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Services</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color: #faeccf;">
    <!-- start services -->
    <section class="d-flex align-items-center py-5 min-vh-100">
        <div class="container">
            <div class="text-center mb-5">

                <p class="text-uppercase text-secondary mb-2" style="letter-spacing: 5px;">
                    Our Services
                </p>

                <h1 class="display-5 fw-normal">
                    Choose Your Style
                </h1>

            </div>
            <div class="row g-4 justify-content-center">
                <div class="col-12 col-md-6">
                    <div class="position-relative overflow-hidden rounded-4 shadow-lg" style="
                            height: 650px;
                            background-image:
                            url('men.jpeg');
                            background-size: cover;
                            background-position: center;
                        ">
                        <div class="position-absolute top-0 start-0 w-100 h-100 bg-dark opacity-50">
                        </div>
                        <div class="position-absolute bottom-0 start-0 w-100 text-center text-white p-4 p-md-5">

                            <div class="fs-2 text-warning mb-2">
                                ✂
                            </div>

                            <h2 class="display-3 fw-normal">
                                MEN
                            </h2>

                            <div class="mx-auto bg-warning mb-3" style="width: 45px; height: 2px;">
                            </div>

                            <p class="text-uppercase small mb-4" style="letter-spacing: 5px;">
                                Hair & Styling
                            </p>

                            <a href="#" class="btn btn-outline-warning px-4 py-2 rounded-0">
                                Explore
                                <span class="ms-3">→</span>
                            </a>

                        </div>

                    </div>

                </div>
                <div class="col-12 col-md-6">

                    <div class="position-relative overflow-hidden rounded-4 shadow-lg" style="
                            height: 650px;
                            background-image:
                            url('women.jpeg');
                            background-size: cover;
                            background-position: center;
                        ">
                        <div class="position-absolute top-0 start-0 w-100 h-100 bg-dark opacity-50">
                        </div>
                        <div class="position-absolute bottom-0 start-0 w-100 text-center text-white p-4 p-md-5">

                            <div class="fs-2 text-warning mb-2">
                                ♡
                            </div>

                            <h2 class="display-3 fw-normal">
                                WOMEN
                            </h2>

                            <div class="mx-auto bg-warning mb-3" style="width: 45px; height: 2px;">
                            </div>

                            <p class="text-uppercase small mb-4" style="letter-spacing: 5px;">
                                Hair & Beauty
                            </p>

                            <a href="#" class="btn btn-outline-warning px-4 py-2 rounded-0">
                                Explore
                                <span class="ms-3">→</span>
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>
    <!-- end services -->
</body>
</html>
