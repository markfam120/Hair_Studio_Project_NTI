<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book Now</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/book.css" />
  </head>
  <body>
    <header class="hero container">
      <div class="eyebrow">HAIR &amp; BEAUTY STUDIO</div>
      <h1>Your Beauty <em>Starts Here</em></h1>
      <p class="lead">
        Choose your service, your favorite stylist, and a time that suits you —
        we'll take care of the rest in a luxurious, relaxing setting.
      </p>

      <div class="row justify-content-center mt-5 g-4">
        <div class="col-6 col-md-3">
          <div class="stat-icon">🏅</div>
          <div class="stat-num">10+</div>
          <div class="stat-label">Years Experience</div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-icon">👤</div>
          <div class="stat-num">2500+</div>
          <div class="stat-label">Happy Clients</div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-icon">✂️</div>
          <div class="stat-num">15+</div>
          <div class="stat-label">Expert Stylists</div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-icon">⭐</div>
          <div class="stat-num">100%</div>
          <div class="stat-label">Quality Service</div>
        </div>
      </div>
    </header>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
